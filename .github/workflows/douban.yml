name: Sync Douban Movies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Douban RSS
        run: python scripts/douban_movies.py

      - name: Save films data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/films.json assets/images/films
          git diff --cached --quiet || git commit -m "Update Douban films"
          git push
